[project]
name = "champions-mcp"
version = "2.0.0"
description = "MCP server for AI-assisted Pokémon Champions team building, served entirely from a local SQLite mirror of pokechamp.gg (single data source)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Lower bound is load-bearing: server.py uses `mcp.server.mcpserver.MCPServer`,
    # which only exists in 2.x. The 1.x `FastMCP` it replaced was removed in the
    # same release, so the two are not interchangeable.
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
champions-mcp = "champions_mcp.server:main"
champions-mcp-pull = "champions_mcp.pull.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/champions_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
