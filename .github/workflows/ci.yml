name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"   # daily: catches an upstream changing shape between commits

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    # The battle-simulator sidecar: building the image runs its quick
    # self-test (a failure fails the build); then the full self-test:
    # legality, every policy x format, determinism across pool sizes, bad
    # input, the policy ladder, tactical scenarios, information modes.
    name: Simulator (build + self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build champions-sim (gated by its quick self-test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sim/Dockerfile
          tags: champions-sim:latest
          load: true
          cache-from: type=gha,scope=champions-sim
          cache-to: type=gha,scope=champions-sim,mode=max
      - name: Full self-test
        run: docker run --rm champions-sim:latest /app/selftest.js

  tests:
    # The Python suite on a real database (roster, movepools, usage: the data
    # tests check real upstream data) whose observed-team corpus is seeded
    # from a recorded slice (tests/fixtures/corpus.json.xz) through the real
    # ingest + scraper code, so no long scrape runs here. The simulator image
    # is present, so the end-to-end simulation tests run too. Strict: a
    # skipped test fails.
    name: Python tests (data pull + simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Restore pull cache
        uses: actions/cache/restore@v4
        with:
          path: data/pull-cache.sqlite
          key: pull-cache-${{ github.run_id }}
          restore-keys: pull-cache-
      - name: Data pull (roster + usage; no corpus scrape)
        run: champions-mcp-pull --skip-builds
      - name: Save pull cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/pull-cache.sqlite
          key: pull-cache-${{ github.run_id }}
      - name: Seed the observed-team corpus from the recorded slice
        run: python tests/fixtures/corpus.py data/champions.sqlite
      - uses: docker/setup-buildx-action@v3
      - name: Build champions-sim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sim/Dockerfile
          tags: champions-sim:latest
          load: true
          cache-from: type=gha,scope=champions-sim
      - name: Check the web chat bridge compiles
        run: python -m py_compile docker/chat/main.py
      - name: "Tests (strict: any skip fails)"
        env:
          CHAMPIONS_MCP_STRICT_TESTS: "1"
        run: pytest -v -rs

  upstreams:
    # One or two real requests per upstream (pokechamp, PokeAPI, Limitless,
    # pokedb export + article index, yakkun, damekei, pokemon-teams, pokesol,
    # note), each through the real client/parser: the replayed corpus can't
    # notice an upstream moving or changing shape, this can.
    name: Upstream endpoints (live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Live endpoint checks
        run: pytest -m live -v
