      "and after your fixes, and the matchup it still loses.",
  };
  const qpButtons = Array.from(document.querySelectorAll('.qp'));
  qpButtons.forEach(btn => btn.addEventListener('click', () => {
    const text = QUICK_PROMPTS[btn.dataset.k];
    inputEl.value = text;
    inputEl.dispatchEvent(new Event('input'));  // auto-resize
    inputEl.focus();
    // a template: select the placeholder so pasting replaces it
    const at = text.indexOf(TEAM_PLACEHOLDER);
    if (at >= 0) inputEl.setSelectionRange(at, at + TEAM_PLACEHOLDER.length);
    else inputEl.setSelectionRange(text.length, text.length);
    inputEl.scrollTop = inputEl.scrollHeight;
  }));

  // ── team panel ────────────────────────────────────────────────────────────────
  // Reads Pokémon and builds out of the tool calls as they stream in (arguments
  // and results), so the right panel fills up while the model works. The team
  // section shows the latest full team the model handled (validate / analyze /
  // simulate / paste), and is marked final at the end of the turn.
  const TeamPanel = (() => {
    const monsEl = document.getElementById('tpMons');
    const teamEl = document.getElementById('tpTeam');
    const monCount = document.getElementById('tpMonCount');
    const teamCount = document.getElementById('tpTeamCount');
    const TYPE_COLORS = {
      Normal: '#a8a77a', Fire: '#ee8130', Water: '#6390f0', Electric: '#f7d02c', Grass: '#7ac74c',
      Ice: '#96d9d6', Fighting: '#c22e28', Poison: '#a33ea1', Ground: '#e2bf65', Flying: '#a98ff3',
      Psychic: '#f95587', Bug: '#a6b91a', Rock: '#b6a136', Ghost: '#735797', Dragon: '#6f35fc',
      Dark: '#9b8b7c', Steel: '#b7b7ce', Fairy: '#d685ad',
    };
    const STAT_KEYS = {
      hp: 'HP', attack: 'Atk', atk: 'Atk', defense: 'Def', def: 'Def',
      'special-attack': 'SpA', special_attack: 'SpA', specialattack: 'SpA', spa: 'SpA',
      'special-defense': 'SpD', special_defense: 'SpD', specialdefense: 'SpD', spd: 'SpD',
      speed: 'Spe', spe: 'Spe',
    };
    const STAT_ORDER = ['HP', 'Atk', 'Def', 'SpA', 'SpD', 'Spe'];
    // Pixel sprites to match the GB theme: Pokémon Showdown's 96px gen5-style
    // sprites (every species and Mega, Champions' new ones included), then its
    // HOME renders and dex sprites. A Mega without either falls back to its species.
    const SPRITES = 'https://play.pokemonshowdown.com/sprites/';
    const NO_HOME = new Set(['floette-eternal']);  // HOME serves a Poké Ball placeholder
    const REGION = { alolan: 'alola', galarian: 'galar', hisuian: 'hisui', paldean: 'paldea' };
    // Form words that aren't part of Showdown's form id ("Blaze Breed" -> blaze).
    const FORM_WORDS = /\s+(breed|form|forme|mode|variety|plumage|flower|cream|pattern|style)$/i;
    // Form labels whose Showdown id differs; '' = the default form (no suffix).
    const FORM_ALIAS = {
      male: '', m: '', female: 'f', jumbo: 'super', midday: '', zero: '', shield: '', amped: '',
      disguised: '', normal: '', fullbelly: '', vanilla: '', natural: '', red: '', green: '',
      phony: '', unremarkable: '', icysnow: '', medium: '', familyofthree: '',
    };
    // Champions' only Floette is the Eternal Flower one ("Floette" in its data).
    const NAME_ALIAS = { floette: 'floette-eternal' };
    // display name -> Showdown name, learned from get_pokemon results
    const learnedNames = new Map();
    const clean = x => String(x || '').toLowerCase().replace(/[^a-z0-9]/g, '');

    /**
     * Any spelling of a Pokémon -> its Showdown id parts. Handles the game's
     * display names ("Paldean Tauros (Blaze Breed)", "Wash Rotom",
     * "Basculegion (Male)", "Gourgeist (Jumbo Variety)"), Showdown names
     * ("Tauros-Paldea-Blaze"), slugs ("basculegion-male") and Megas
     * ("Mega Charizard Y"). Returns {id: 'tauros-paldeablaze', head: 'tauros', mega}.
     */
    function canonical(name) {
      let n = String(name || '').trim();
      n = learnedNames.get(n.toLowerCase()) || n;
      let mega = '';
      const mm = n.match(/^Mega\s+(.+?)(?:\s+([XYZ]))?$/i);
      if (mm) { n = mm[1]; mega = 'mega' + (mm[2] || '').toLowerCase(); }
      let region = '', forme = '';
      const rm = n.match(/^(Alolan|Galarian|Hisuian|Paldean)\s+(.+)$/i);
      if (rm) { region = REGION[rm[1].toLowerCase()]; n = rm[2]; }
      const rot = n.match(/^(Wash|Fan|Frost|Heat|Mow)\s+Rotom$/i);
      if (rot) { n = 'Rotom'; forme = rot[1]; }
      const pm = n.match(/^(.+?)\s*\(([^()]+)\)$/);
      if (pm) { n = pm[1]; forme = pm[2].trim().replace(FORM_WORDS, ''); }
      let head = n, rest = '';
      if (n.includes('-')) { const [h, ...r] = n.split('-'); head = h; rest = r.join(''); }
      let f = clean(forme);
      if (f in FORM_ALIAS) f = FORM_ALIAS[f];
      let r = clean(rest);
      if (r in FORM_ALIAS) r = FORM_ALIAS[r];
      const suffix = r || (clean(region) + f);
      let id = clean(head) + (suffix ? '-' + suffix : '');
      id = NAME_ALIAS[id] || id;
      return { id, head: clean(head), mega };
    }

    function spriteIds(name, item) {
      const { id: base, head, mega: megaName } = canonical(name);
      let mega = megaName;
      // a held Mega Stone (Charizardite Y, Garchompite Z, Mawilite) -> its Mega
      const st = String(item || '').match(/^(\w+?)ite(?:\s+([XYZ]))?$/i);
      if (!mega && st && head.startsWith(clean(st[1]).slice(0, 4))) mega = 'mega' + (st[2] || '').toLowerCase();
      const ids = [];
      if (mega) ids.push(`gen5/${head}-${mega}`, `home-centered/${head}-${mega}`);
      ids.push(`gen5/${base}`);
      if (!NO_HOME.has(base)) ids.push(`home-centered/${base}`);
      ids.push(`dex/${base}`, `dex/${head}`);
      return [...new Set(ids)].map(i => `${SPRITES}${i}.png`);
    }
    function spriteTag(name, item) {
      const [first, ...rest] = spriteIds(name, item);
      return `<img class="tp-sprite" loading="lazy" alt="${esc(name)}" src="${first}" data-next="${esc(rest.join(' '))}" onerror="nextSprite(this)">`;
    }
    // Tools whose `team`-like argument is a whole team, with how much to trust it.
    const TEAM_TOOLS = {
      create_pokepaste: 'exported', simulate_vs_meta: 'battle-tested', compare_team_variants: 'battle-tested',
      simulate_matchup: 'battle-tested', simulate_battle_log: 'battle-tested',
      validate_team: 'validated', analyze_team: 'analysed',
    };
    const TEAM_ARGS = ['team', 'base_team', 'team_a'];

    let mons = new Map();     // key -> {name, types, abilities, base, rank, set, seen:Set, order}
    let team = null;          // {members:[set], tag, tool, url, sim}
    let order = 0;
    let freshKeys = new Set();

    const key = s => canonical(s).id;
    const asArray = v => (Array.isArray(v) ? v : v == null || v === '' ? [] : [v]);

    function spOf(m) {
      const raw = m.stat_points || m.sp || m.evs || m.ev || m.spread;
      if (!raw) return null;
      if (typeof raw === 'string') return parseEVs(raw);
      const out = {};
      for (const [k, v] of Object.entries(raw)) {
        const s = STAT_KEYS[String(k).toLowerCase().replace(/\s+/g, '_')];
        if (s && Number(v)) out[s] = Number(v);
      }
      return Object.keys(out).length ? out : null;
    }
    function parseEVs(s) {
      const out = {};
      for (const part of String(s).split('/')) {
        const m = part.trim().match(/^(\d+)\s+(\w+)/);
        if (m) {
          const k = STAT_KEYS[m[2].toLowerCase()] || ({ hp: 'HP' })[m[2].toLowerCase()];
          if (k) out[k] = Number(m[1]);
        }
      }
      return Object.keys(out).length ? out : null;
    }

    function memberOf(m) {
      if (!m || typeof m !== 'object') return null;
      const species = m.species || m.name || m.pokemon;
      if (!species) return null;
      const moves = asArray(m.moves).flatMap(x => String(x).split(/\s*\/\s*/)).filter(Boolean);
      return {
        species: String(species), item: m.item || '', ability: m.ability || '',
        nature: m.nature || '', moves, sp: spOf(m),
      };
    }

    // Showdown paste text -> sets (blocks with an Ability / Nature / EVs / move line)
    function parsePaste(text) {
      const out = [];
      for (const block of String(text).replace(/\r/g, '').split(/\n\s*\n/)) {
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        if (!lines.length) continue;
        const head = lines[0].match(/^(.+?)(?:\s*@\s*(.+))?$/);
        if (!head) continue;
        let name = head[1].replace(/\s*\((M|F)\)\s*$/, '');
        const nick = name.match(/\(([^()]+)\)\s*$/);
        if (nick) name = nick[1];
        const set = { species: name.trim(), item: (head[2] || '').trim(), ability: '', nature: '', moves: [], sp: null };
        let isSet = false;
        for (const l of lines.slice(1)) {
          if (/^Ability:/i.test(l)) { set.ability = l.replace(/^Ability:\s*/i, ''); isSet = true; }
          else if (/^EVs:/i.test(l)) { set.sp = parseEVs(l.replace(/^EVs:\s*/i, '')); isSet = true; }
          else if (/\sNature$/i.test(l)) { set.nature = l.replace(/\s+Nature$/i, ''); isSet = true; }
          else if (/^[-–]\s+/.test(l)) { set.moves.push(l.replace(/^[-–]\s+/, '')); isSet = true; }
        }
        if (isSet) out.push(set);
      }
      return out;
    }

    function teamFrom(value) {
      if (typeof value === 'string') return parsePaste(value);
      if (Array.isArray(value)) return value.map(memberOf).filter(Boolean);
      return [];
    }

    function upsert(name, patch, source) {
      if (!name) return;
      const k = key(name);
      if (!k) return;
      const cur = mons.get(k) || { name: String(name), set: {}, seen: new Set(), order: 0 };
      if (patch.info) {
        Object.assign(cur, patch.info);
        if (patch.info.name) cur.name = patch.info.name;
      }
      if (patch.set) {
        // keep what we knew, overwrite with whatever this call states
        for (const [f, v] of Object.entries(patch.set)) {
          if (v && !(Array.isArray(v) && !v.length)) cur.set[f] = v;
        }
      }
      if (source) cur.seen.add(source);
      cur.order = ++order;
      mons.set(k, cur);
      freshKeys.add(k);
    }

    function fromResult(name, text) {
      let data;
      try { data = JSON.parse(text); } catch { return null; }
      return data;
    }

    function readInfo(obj, source) {
      if (obj && obj.name && obj.showdown_name) learnedNames.set(String(obj.name).toLowerCase(), obj.showdown_name);
      // get_pokemon-shaped records: name + types (+ base stats, abilities, usage rank)
      if (!obj || typeof obj !== 'object' || !Array.isArray(obj.types) || !(obj.name || obj.showdown_name)) return;
      const base = {};
      for (const [k, v] of Object.entries(obj.base_stats || {})) {
        const s = STAT_KEYS[String(k).toLowerCase()];
        if (s) base[s] = v;
      }
      upsert(obj.name || obj.showdown_name, {
        info: {
          name: obj.name || obj.showdown_name, types: obj.types,
          abilities: obj.abilities, base: Object.keys(base).length ? base : undefined,
          rank: obj.usage_rank,
        },
      }, source);
    }

    function setTeam(members, tag, tool, extra = {}) {
      if (members.length < 3) return;  // a core or a pair is not "the team"
      const prev = team && key(team.members.map(m => m.species).sort().join()) === key(members.map(m => m.species).sort().join()) ? team : null;
      team = { members, tag, tool, url: extra.url || prev?.url, sim: extra.sim || prev?.sim, final: false };
      for (const m of members) upsert(m.species, { set: m }, tool);
    }

    function onTool(ev) {
      const name = ev.name || '';
      const args = ev.arguments || {};
      const result = typeof ev.result === 'string' ? ev.result : JSON.stringify(ev.result ?? '');
      freshKeys = new Set();

      // whole teams passed to team-level tools
      if (TEAM_TOOLS[name]) {
        for (const a of TEAM_ARGS) {
          if (args[a] == null) continue;
          const members = teamFrom(args[a]);
          if (members.length) {
            let extra = {};
            const data = fromResult(name, result);
            if (data && name === 'create_pokepaste' && data.url) extra.url = data.url;
            if (data && typeof data.win_rate === 'number' && !data.error) {
              extra.sim = { wr: data.win_rate, ci: data.win_rate_ci95, games: data.games, opp: data.opponents_used,
                            worst: (data.worst_matchups || [])[0]?.label, format: data.format };
              for (const m of data.members || []) {
                upsert(m.species, {}, name);
                const cur = mons.get(key(m.species));
                if (cur) cur.sim = m;
              }
            }
            setTeam(members, TEAM_TOOLS[name], name, extra);
            break;
          }
        }
        if (name === 'compare_team_variants') {
          for (const v of asArray(args.variants)) for (const m of teamFrom(v)) upsert(m.species, { set: m }, name);
        }
        if (args.team_b) for (const m of teamFrom(args.team_b)) upsert(m.species, {}, name + ' (opponent)');
      }

      // single Pokémon in calc / stat / lookup tools
      for (const side of ['attacker', 'defender']) {
        if (args[side]) {
          upsert(args[side], {
            set: {
              item: args[`${side}_item`], ability: args[`${side}_ability`], nature: args[`${side}_nature`],
              sp: args[`${side}_stat_points`] ? spOf({ stat_points: args[`${side}_stat_points`] }) : null,
            },
          }, name);
        }
      }
      if (name === 'calc_damage' && args.attacker && args.move) {
        const cur = mons.get(key(args.attacker));
        if (cur) cur.calcMoves = Array.from(new Set([...(cur.calcMoves || []), args.move]));
      }
      for (const a of ['species', 'pokemon', 'name']) {
        if (typeof args[a] === 'string' && /^(get_pokemon|get_pokemon_moves|get_pokemon_sets|get_observed_sets|get_historical_sets|get_pokemon_weaknesses|get_top_teammates|calc_stats|compute_speed|compute_speed_threshold|is_legal_pokemon|is_legal_move)$/.test(name)) {
          upsert(args[a], {
            set: name === 'calc_stats' || name === 'compute_speed'
              ? { nature: args.nature, sp: args.stat_points ? spOf({ stat_points: args.stat_points }) : null } : {},
          }, name);
        }
      }

      // what results teach us (typing, base stats, usage rank)
      const data = fromResult(name, result);
      if (data && !data.error) {
        readInfo(data, name);
        for (const v of Object.values(data)) {
          if (Array.isArray(v)) v.slice(0, 12).forEach(x => readInfo(x, null));
        }
      }
      render();
    }

    function onFinal(content) {
      // prefer the exported team; else the last team handled; else a paste in the answer
      if (!team || team.tool !== 'create_pokepaste') {
        const blocks = [...String(content || '').matchAll(/```[a-z]*\n([\s\S]*?)```/gi)].map(m => m[1]);
        const pasted = blocks.map(parsePaste).filter(t => t.length >= 3).pop();
        if (pasted && (!team || pasted.length >= team.members.length)) setTeam(pasted, 'from the answer', 'answer');
      }
      const url = String(content || '').match(/https?:\/\/pokepast\.es\/[0-9a-z]+/i);
      if (team) {
        if (url && !team.url) team.url = url[0];
        team.final = true;
      }
      freshKeys = new Set();
      render();
    }

    function reset() {
      mons = new Map(); team = null; order = 0; freshKeys = new Set();
      render();
    }

    // ── rendering ──
    const typeBadges = types => (types || []).map(t =>
      `<span class="tp-type" style="background:${TYPE_COLORS[t] || '#94a3b8'}">${esc(t)}</span>`).join('');

    function statsRow(stats, cls) {
      if (!stats) return '';
      return `<div class="tp-stats">${STAT_ORDER.map(s =>
        `<div class="tp-stat ${cls}">${s}<span>${stats[s] ?? (cls === 'sp' ? 0 : '–')}</span></div>`).join('')}</div>`;
    }

    function card(m, setOverride) {
      const set = setOverride || m.set || {};
      const info = mons.get(key(set.species || m.name)) || m;
      const rank = info.rank || {};
      const rankTxt = [rank.singles ? `BSS #${rank.singles}` : '', rank.doubles ? `VGC #${rank.doubles}` : ''].filter(Boolean).join(' · ');
      const lines = [];
      if (set.ability || set.nature) {
        lines.push(`<div class="tp-line">${set.ability ? `<b>${esc(set.ability)}</b>` : ''}${set.ability && set.nature ? ' · ' : ''}${set.nature ? `${esc(set.nature)}` : ''}</div>`);
      }
      const moves = (set.moves && set.moves.length ? set.moves : info.calcMoves) || [];
      const sim = info.sim;
      return `<div class="tp-mon${freshKeys.has(key(set.species || m.name)) ? ' fresh' : ''}">
        ${spriteTag(set.species || info.name, set.item)}
        <div class="tp-body">
        <div class="tp-mon-head">
          <span class="tp-name">${esc(info.name || set.species)}</span>${typeBadges(info.types)}
          ${set.item ? `<span class="tp-item">@ ${esc(set.item)}</span>` : ''}
          ${rankTxt ? `<span class="tp-rank" title="Usage rank">${esc(rankTxt)}</span>` : ''}
        </div>
        ${lines.join('')}
        ${moves.length ? `<div class="tp-moves">${moves.slice(0, 4).map(x => `<span class="tp-move">${esc(x)}</span>`).join('')}</div>` : ''}
        ${set.sp ? statsRow(set.sp, 'sp') : (!setOverride && info.base ? statsRow(info.base, '') : '')}
        ${sim ? `<div class="tp-line">Sim: brought ${Math.round(sim.brought_pct * 100)}% · wins ${sim.win_rate_when_brought != null ? Math.round(sim.win_rate_when_brought * 100) + '%' : '–'} when brought · ${sim.kos_per_game_brought ?? '–'} KO/game</div>` : ''}
        ${!setOverride && m.seen && m.seen.size ? `<div class="tp-seen">${[...m.seen].slice(-4).map(s => `<span>${esc(s)}</span>`).join('')}</div>` : ''}
        </div>
      </div>`;
    }

    function render() {
      const list = [...mons.values()].sort((a, b) => b.order - a.order);
      monCount.textContent = list.length ? `· ${list.length}` : '';
      monsEl.innerHTML = list.length ? list.map(m => card(m)).join('')
        : '<p class="tp-empty">Every Pokémon the model looks up, calcs or builds shows here, with what it has learned about it.</p>';
      if (!team) {
        teamCount.textContent = '';
        teamEl.innerHTML = '<p class="tp-empty">The team appears here as the model drafts, validates, simulates and exports it.</p>';
        return;
      }
      teamCount.textContent = `· ${team.members.length}`;
      const sim = team.sim;
      const ci = sim && sim.ci ? ` <span title="95% confidence interval">[${Math.round(sim.ci[0] * 100)}–${Math.round(sim.ci[1] * 100)}%]</span>` : '';
      teamEl.innerHTML = `<div class="tp-team${team.final ? ' final' : ''}">
        <div class="tp-team-head">
          <span class="tp-team-tag">${team.final ? 'Final team' : esc(team.tag)}</span>
          <span class="tp-team-src">${team.url ? `<a href="${esc(team.url)}" target="_blank" rel="noopener">Poképaste ↗</a>` : `via ${esc(team.tool)}`}</span>
        </div>
        ${sim ? `<div class="tp-sim">Simulated: <b>${Math.round(sim.wr * 100)}%</b>${ci} over ${sim.games} games vs ${sim.opp} meta teams${sim.worst ? ` · worst: <span class="lo">${esc(sim.worst)}</span>` : ''}</div>` : ''}
        <div class="tp-grid">${team.members.map(s => card(mons.get(key(s.species)) || { name: s.species }, s)).join('')}</div>
      </div>`;
    }

    return { onTool, onFinal, reset, parsePaste, teamFrom, _state: () => ({ mons, team }) };
  })();

  // Sprite fallback chain (Mega render -> species render -> dex sprite -> hidden).
  function nextSprite(img) {
    const rest = (img.dataset.next || '').split(' ').filter(Boolean);
    if (!rest.length) { img.style.visibility = 'hidden'; img.onerror = null; return; }
    img.dataset.next = rest.slice(1).join(' ');
    img.src = rest[0];
  }

  const panelChk = document.getElementById('panelChk');
  if (window.matchMedia('(max-width: 860px)').matches) panelChk.checked = false;
  const applyPanel = () => document.body.classList.toggle('hide-panel', !panelChk.checked);
  panelChk.addEventListener('change', applyPanel);
  applyPanel();

  // ── initial render ──────────────────────────────────────────────────────────────
  addBubble('info', INTRO_HTML);
  SessionStore.all().then(list => {
    const last = list.sort((a, b) => b.updated - a.updated)[0];
    if (last) openSession(last.id);
    else refreshSessionList();
  });
</script>
<script src="/static/config.js"></script>
</body>
</html>
