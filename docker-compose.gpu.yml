# NVIDIA GPU for the web chat's local model (llama-server).
#
# Kept out of docker-compose.yml because a GPU reservation makes `up` fail on
# machines without the NVIDIA container runtime — even for OpenRouter-only use.
# Enable it on a GPU machine (needs nvidia-container-toolkit on Linux, or
# Docker Desktop's WSL2 GPU support) by adding to .env:
#
#   COMPOSE_FILE=docker-compose.yml;docker-compose.gpu.yml    # Windows
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml    # Linux / macOS
#
# then `docker compose --profile webchat up -d` as usual.
services:
  llama-server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
