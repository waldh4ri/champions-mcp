# champions-mcp v2 docker-compose stack
#
# Services
# --------
#   champions-calc - @smogon/calc HTTP sidecar (Node 20, gen-0 Champions mode)
#   champions-sim  - Pokémon Showdown battle simulator sidecar (Node 22, champions mod)
#   champions-mcp  - MCP server (Python 3.12, streamable-HTTP transport)
#
# These three form the core stack and are always started. Two optional
# profiles add a web chat UI on top of it:
#   webchat      champions-chat - web chat UI (:3000) + MCP tool-calling bridge,
#                with local models on CPU + RAM (llama-server) and API providers
#   webchat-gpu  the same, with local models on an NVIDIA GPU (llama-server-gpu)
# See the "Web chat" block further down.
#
# Quick start
# -----------
#   docker compose up -d --build                        # core stack only
#   docker compose --profile webchat up -d --build      # + web chat (local models on CPU)
#   docker compose --profile webchat-gpu up -d --build  # + web chat (local models on the GPU)
#   docker compose --profile "*" down                   # stop, whichever was started
# A profile set as COMPOSE_PROFILES in .env applies to every command instead
# (a plain `down` skips profiles that aren't active: "network still in use").
#
# On first start champions-mcp runs `champions-mcp-pull --skip-builds` to build
# the local champions.sqlite from pokechamp.gg (+ PokeAPI for the type chart and
# localized species names), persisted in the champions-data volume, then serves
# while the slow observed-team corpus is fetched in the background. Stale data
# (or CHAMPIONS_MCP_PULL=1) is refreshed in the background too, serving the old
# data meanwhile. Between pulls the server is fully offline.
#
# The MCP URL is printed after startup. Default: http://localhost:8000/mcp
#
# Logs
# ----
#   docker compose logs -f                  # everything, colored, one event per line
#   docker compose logs -f champions-mcp    # pull progress, readiness, every tool call
# Every service logs "HH:MM:SS.mmm LEVEL component [request-id] message key=value".
# A tool call's [request-id] also appears on the calc/sim lines it caused (and
# a chat turn's id on everything it triggered). LOG_LEVEL=DEBUG for detail,
# LOG_COLOR=0 for plain text (e.g. when shipping logs elsewhere).

# Shared by every service: rotate the json-file logs `docker logs` reads, so
# a long-running stack doesn't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# llama.cpp server for the web chat, shared by llama-server (CPU, profile
# webchat) and llama-server-gpu (NVIDIA GPU, profile webchat-gpu); see the
# "Web chat" block below.
x-llama-env: &llama-env
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"  # DEBUG | INFO | WARNING | ERROR (all services share it)
  LOG_COLOR: "${LOG_COLOR:-1}"  # ANSI colors in `docker compose logs`; 0 = plain text
  LLAMA_PORT: "8080"  # container-side listen port passed to llama-server; must match the "ports:" mapping
  # Per-model settings (context, KV cache, GPU layers, MoE offload, reasoning
  # budget, MTP) live in the web chat's Configuration view, which writes them
  # to /config/presets.ini; their defaults are on champions-chat.
  LLAMA_MODELS_MAX: "${LLAMA_MODELS_MAX:-1}"  # models loaded at once (picking another unloads it)
  LLAMA_PARALLEL: "${LLAMA_PARALLEL:-1}"  # one user: no parallel slots
  # Keep the model's thinking across the conversation (the chat replays
  # reasoning_content for prior turns too — see docker/chat/main.py).
  LLAMA_REASONING_PRESERVE: "${LLAMA_REASONING_PRESERVE:-1}"
  LLAMA_NO_MMAP: "${LLAMA_NO_MMAP:-1}"  # read weights into RAM up front: steadier decode, exact load progress
  LLAMA_MLOCK: "${LLAMA_MLOCK:-0}"  # pin weights in RAM (needs the IPC_LOCK cap + RAM)
  HF_TOKEN: "${HF_TOKEN:-}"  # only for gated/private Hugging Face repos
  # Free-form escape hatch for llama-server flags the Configuration view
  # doesn't cover (applies to every model, overrides its settings).
  LLAMA_EXTRA_ARGS: "${LLAMA_EXTRA_ARGS:-}"

x-llama: &llama
  build:
    context: .
    dockerfile: docker/llama/Dockerfile
  ports:
    - "${LLAMA_PORT:-8080}:8080"  # host:container — LLAMA_PORT changes the host side
  cap_add:
    - IPC_LOCK    # Required for --mlock
  volumes:
    # Downloaded models. llama.cpp writes to ~/.cache/huggingface (and older
    # builds to ~/.cache/llama.cpp): mount the whole cache dir so they persist.
    - llama_models:/root/.cache
    - ./models:/models:ro                   # your own .gguf files
    - chat-data:/config                     # presets.ini written by champions-chat's Configuration view
  restart: unless-stopped
  logging: *default-logging
  healthcheck:
    # Healthy when the router answers, or when deliberately idle (GPU variant
    # without a visible GPU: the entrypoint logs why).
    test: ["CMD-SHELL", "test -f /tmp/llama-disabled || curl -sf http://127.0.0.1:8080/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s
  networks:
    mcp-internal:
      aliases: [llama]  # the chat reaches either variant as http://llama:8080

services:

  # Damage-calculation engine backing champions-mcp's calc_damage/calc_stats
  # tools. Kept as its own HTTP sidecar (rather than embedded in the Python
  # image) so the Node/TypeScript @smogon/calc toolchain stays isolated from
  # champions-mcp's own dependencies and image.
  champions-calc:
    build:
      context: .
      dockerfile: docker/calc/Dockerfile
    image: ${CALC_IMAGE:-champions-calc:latest}
    command: ["/app/server.js"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"  # DEBUG | INFO | WARNING | ERROR (all services share it)
      LOG_COLOR: "${LOG_COLOR:-1}"  # ANSI colors in `docker compose logs`; 0 = plain text
      PORT: "3000"  # container-side listen port; only reachable over mcp-internal, never published to the host
    healthcheck:
      # Gates champions-mcp's startup (see its depends_on below) until the
      # sidecar can actually serve damage-calc requests.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mcp-internal

  # Battle-simulation engine backing the simulate_* / compare_team_variants
  # tools: Pokémon Showdown's simulator (champions mod, pinned commit) behind
  # a small HTTP API with a worker-thread pool. CPU-bound; SIM_WORKERS caps
  # the threads (default: all cores but one).
  champions-sim:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    image: ${SIM_IMAGE:-champions-sim:latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"  # DEBUG | INFO | WARNING | ERROR (all services share it)
      LOG_COLOR: "${LOG_COLOR:-1}"  # ANSI colors in `docker compose logs`; 0 = plain text
      PORT: "3000"  # container-side listen port; only reachable over mcp-internal, never published to the host
      SIM_WORKERS: "${SIM_WORKERS:-0}"  # 0 = cores - 1
      SIM_MAX_BATTLES: "${SIM_MAX_BATTLES:-50000}"  # hard per-request cap (the MCP side enforces its own, lower cap)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mcp-internal

  # Core MCP server: exposes the team-building/calc tools over streamable-HTTP,
  # reading the local SQLite mirror and delegating damage math to champions-calc.
  champions-mcp:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${MCP_PORT:-8000}:8000"  # host:container — override MCP_PORT to change the host side; container always listens on 8000 (FASTMCP_PORT below)
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"  # DEBUG | INFO | WARNING | ERROR (all services share it)
      LOG_COLOR: "${LOG_COLOR:-1}"  # ANSI colors in `docker compose logs`; 0 = plain text
      MCP_TRANSPORT: "streamable-http"  # MCP transport protocol served by the app (see entrypoint.sh / MCPServer.run)
      FASTMCP_HOST: "0.0.0.0"  # bind address inside the container; 0.0.0.0 so the published port mapping can reach it
      FASTMCP_PORT: "8000"  # container-side listen port; must match the "ports:" mapping above and EXPOSE in the Dockerfile
      PUBLISHED_PORT: "${MCP_PORT:-8000}"  # host-side port, echoed into the startup banner (entrypoint.sh) so the printed MCP URL is correct even when MCP_PORT is overridden
      # Calc sidecar endpoint (HTTP instead of docker-in-docker)
      CHAMPIONS_MCP_CALC_HTTP: "http://champions-calc:3000/"
      # Battle-simulator sidecar endpoint + per-call battle cap
      CHAMPIONS_MCP_SIM_HTTP: "http://champions-sim:3000/"
      CHAMPIONS_MCP_SIM_MAX_BATTLES: "${CHAMPIONS_MCP_SIM_MAX_BATTLES:-20000}"
      # Data location (persisted volume)
      CHAMPIONS_MCP_DATA_DIR: "/data"
      CHAMPIONS_MCP_DB: "/data/champions.sqlite"
      CHAMPIONS_MCP_CACHE_DB: "/data/pull-cache.sqlite"
      # Set to 1 to re-pull fresh data on next restart
      CHAMPIONS_MCP_PULL: "${CHAMPIONS_MCP_PULL:-0}"
      # A restart also re-pulls when the data is older than this many days, or
      # was built by an older version than the code needs (0 = age check off).
      CHAMPIONS_MCP_MAX_DATA_AGE_DAYS: "${CHAMPIONS_MCP_MAX_DATA_AGE_DAYS:-7}"
      # Roster/movepool/reference/usage source (see .env.example)
      CHAMPIONS_MCP_POKECHAMP_BASE: "${CHAMPIONS_MCP_POKECHAMP_BASE:-https://pokechamp.gg}"
      # Observed-team corpus (Limitless teamlists + pokedb ranked ladder).
      # All optional — see .env.example. The key only raises the rate limit;
      # the pull works unauthenticated, it just paces itself.
      CHAMPIONS_MCP_BUILDS_SKIP: "${CHAMPIONS_MCP_BUILDS_SKIP:-0}"  # 1 = skip the corpus (entrypoint.sh passes --skip-builds)
      CHAMPIONS_MCP_LIMITLESS_KEY: "${CHAMPIONS_MCP_LIMITLESS_KEY:-}"
      CHAMPIONS_MCP_BUILDS_REGULATIONS: "${CHAMPIONS_MCP_BUILDS_REGULATIONS:-M-C}"
      CHAMPIONS_MCP_BUILDS_MAX_EVENTS: "${CHAMPIONS_MCP_BUILDS_MAX_EVENTS:-150}"
      CHAMPIONS_MCP_BUILDS_MIN_PLAYERS: "${CHAMPIONS_MCP_BUILDS_MIN_PLAYERS:-16}"
      CHAMPIONS_MCP_BUILDS_HALF_LIFE_DAYS: "${CHAMPIONS_MCP_BUILDS_HALF_LIFE_DAYS:-21}"
      # Complete BSS teams scraped from published team reports (pull/reports.py),
      # run with the observed-team stage; 1 = skip just this step.
      CHAMPIONS_MCP_REPORTS_SKIP: "${CHAMPIONS_MCP_REPORTS_SKIP:-0}"
    volumes:
      - champions-data:/data  # persists champions.sqlite + pull-cache.sqlite (see CHAMPIONS_MCP_DATA_DIR above) across container restarts/rebuilds
    depends_on:
      champions-calc:
        # Wait until champions-calc's healthcheck passes before starting: this
        # server calls out to it synchronously for damage calcs, so starting
        # earlier would just surface connection errors on the first request.
        condition: service_healthy
      champions-sim:
        # Only the simulate_* tools need it, so don't hold the server back on
        # it: those tools report the sidecar as unreachable until it's up.
        condition: service_started
    networks:
      - mcp-internal

  # ==========================================================================
  # Web chat
  #   docker compose --profile webchat up -d --build       chat + local models on CPU/RAM
  #   docker compose --profile webchat-gpu up -d --build   chat + local models on an NVIDIA GPU
  #   (down: same flag, or --profile "*"; or set COMPOSE_PROFILES in .env)
  #
  #   champions-chat   - light web UI + MCP tool-calling bridge at :3000. Offers
  #                      every backend that is available — local models,
  #                      OpenRouter (OPENROUTER_API_KEY), any OpenAI-compatible
  #                      API — and manages local models (⚙ Configure).
  #   llama-server     - llama.cpp in router mode (webchat): CPU + system RAM.
  #   llama-server-gpu - the same on the NVIDIA GPU (webchat-gpu). Docker can't
  #                      make a GPU request optional — without the NVIDIA
  #                      runtime, creating the container fails — hence a profile
  #                      of its own.
  # Both start with no model loaded, serve every .gguf in ./models, download
  # models added from the chat (a Hugging Face link) into the llama_models
  # volume (shared: a model downloaded once serves both), load whichever model a
  # chat picks, and answer the chat as http://llama:8080.
  # ==========================================================================
  llama-server:
    <<: *llama
    build:
      context: .
      dockerfile: docker/llama/Dockerfile
      args:
        BASE_IMAGE: ghcr.io/ggml-org/llama.cpp:server  # llama.cpp's CPU build
    image: ${LLAMA_CPU_IMAGE:-champions-llama-cpu:latest}
    container_name: champions-llama
    profiles: ["webchat"]
    environment:
      <<: *llama-env
      LLAMA_DEVICE: "cpu"

  llama-server-gpu:
    <<: *llama
    image: ${LLAMA_IMAGE:-champions-llama:latest}
    container_name: champions-llama-gpu
    profiles: ["webchat-gpu"]
    environment:
      <<: *llama-env
      LLAMA_DEVICE: "gpu"
    # NVIDIA GPU passthrough (nvidia-container-toolkit on Linux; WSL2 GPU support
    # with Docker Desktop).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  champions-chat:
    build:
      context: .
      dockerfile: docker/chat/Dockerfile
    container_name: champions-chat
    # Offers every available backend in the UI's model picker: local models
    # (llama-server on CPU, or llama-server-gpu), OpenRouter and OpenAI-compatible APIs.
    profiles: ["webchat", "webchat-gpu"]
    ports:
      - "${WEBUI_PORT:-3000}:3000"  # host:container — override WEBUI_PORT to change the host side; container always listens on 3000 (fixed by the Dockerfile's uvicorn CMD)
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"  # DEBUG | INFO | WARNING | ERROR (all services share it)
      LOG_COLOR: "${LOG_COLOR:-1}"  # ANSI colors in `docker compose logs`; 0 = plain text
      LLAMA_BASE_URL: "http://llama:8080"  # llama-server's address on the internal network (Docker DNS resolves the service name)
      MCP_URL: "http://champions-mcp:8000/mcp"  # champions-mcp's MCP endpoint on the internal network
      # Endpoints and settings added in the UI's Models panel persist here.
      CHAT_DATA_DIR: "/data"
      # An OpenAI-compatible API (vLLM, LM Studio, Ollama's /v1, a hosted
      # provider...) offered in the model picker. More can be added in the UI.
      OPENAI_COMPAT_NAME: "${OPENAI_COMPAT_NAME:-}"  # label in the picker (default: the URL's host)
      OPENAI_COMPAT_BASE_URL: "${OPENAI_COMPAT_BASE_URL:-}"  # e.g. http://host.docker.internal:1234/v1
      OPENAI_COMPAT_API_KEY: "${OPENAI_COMPAT_API_KEY:-}"
      OPENAI_COMPAT_MODELS: "${OPENAI_COMPAT_MODELS:-}"  # comma-separated; empty = the API's /models list
      # Local-model (llama.cpp) defaults. The Configuration view overrides them
      # (globally or per model); empty = automatic.
      LLAMA_CTX_SIZE: "${LLAMA_CTX_SIZE:-}"  # empty = llama.cpp fits the largest context the GPU holds
      LLAMA_CACHE_TYPE_K: "${LLAMA_CACHE_TYPE_K:-q8_0}"  # q8_0 KV: half of f16's memory at practically the same quality
      LLAMA_CACHE_TYPE_V: "${LLAMA_CACHE_TYPE_V:-q8_0}"
      LLAMA_N_GPU_LAYERS: "${LLAMA_N_GPU_LAYERS:-99}"  # all layers on the GPU
      LLAMA_N_CPU_MOE: "${LLAMA_N_CPU_MOE:-}"  # MoE models bigger than VRAM: layers whose experts stay on the CPU
      LLAMA_FLASH_ATTN: "${LLAMA_FLASH_ATTN:-on}"
      # Cap thinking tokens per round: a team build runs dozens of tool rounds,
      # unbounded thinking on each is the difference between planning and musing.
      LLAMA_REASONING_BUDGET: "${LLAMA_REASONING_BUDGET:-2048}"
      LLAMA_MTP_ENABLED: "${LLAMA_MTP_ENABLED:-1}"  # speculative decoding with a model's own draft head (MTP...) when it has one
      # Thinking on by default: this workload is multi-step tool planning over
      # 30+ tools plus SP/damage arithmetic, which is exactly where the
      # reasoning block pays for itself. Bounded by LLAMA_REASONING_BUDGET on
      # the llama-server side so it plans briefly instead of musing each round.
      LLAMA_THINK: "${LLAMA_THINK:-true}"    # false | true (Qwen reasoning block)
      # Tool rounds per turn and max characters per tool result. Leave unset:
      # the chat sizes both to the model's context (40 rounds / 16k chars for
      # the local 131k model, 80 / 60k for 1M-context OpenRouter models). A
      # value here overrides that for every model, so a fixed default would
      # silently hold big models to the local model's limits.
      MAX_TOOL_ROUNDS: "${MAX_TOOL_ROUNDS:-}"
      MAX_TOOL_RESULT_CHARS: "${MAX_TOOL_RESULT_CHARS:-}"
      # Sampling. Unset previously, so requests fell back to llama.cpp's generic
      # defaults rather than Qwen3's published values; the bridge now sends the
      # per-mode profile (thinking: 0.6/0.95/20 — instruct: 0.7/0.8/20). Raising
      # temperature does NOT make teams more creative, it makes facts less
      # reliable — leave these alone and let the prompt drive creativity.
      LLAMA_TEMPERATURE: "${LLAMA_TEMPERATURE:-}"
      LLAMA_TOP_P: "${LLAMA_TOP_P:-}"
      LLAMA_TOP_K: "${LLAMA_TOP_K:-}"
      LLAMA_MIN_P: "${LLAMA_MIN_P:-}"
      # Unlike the four sampling params above, this defaults ON (0.5) rather
      # than unset — see main.py's repetition-penalty rationale.
      LLAMA_PRESENCE_PENALTY: "${LLAMA_PRESENCE_PENALTY:-0.5}"
      # Cap on cross-turn reasoning replay: only the last N prior turns keep
      # their reasoning_content (each truncated to MAX_REASONING_CHARS),
      # so --reasoning-preserve doesn't grow context unboundedly.
      MAX_REASONING_HISTORY_TURNS: "${MAX_REASONING_HISTORY_TURNS:-3}"
      MAX_REASONING_CHARS: "${MAX_REASONING_CHARS:-4000}"
      # Backends offered: auto (default) = every one that is available (local
      # model when loaded, OpenRouter when a key is set); llama / openrouter =
      # only that one.
      CHAT_PROVIDER: "${CHAT_PROVIDER:-auto}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # Comma-separated fixed models. The Auto Router at each cost tier,
      # "openrouter/auto (low|medium|high)", is always offered in addition.
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash,openai/gpt-6-luna,google/gemini-4-argon}"
      # Candidate pools per tier (empty = OpenRouter's whole ranking for that band).
      # Several providers per model: price = cheapest first (default) |
      # throughput | latency | default (OpenRouter's load balancing).
      OPENROUTER_PROVIDER_SORT: "${OPENROUTER_PROVIDER_SORT:-price}"
      OPENROUTER_AUTO_MODELS: "${OPENROUTER_AUTO_MODELS:-deepseek/deepseek-v4.1-flash,openai/gpt-6-luna}"  # low
      OPENROUTER_AUTO_MODELS_MEDIUM: "${OPENROUTER_AUTO_MODELS_MEDIUM:-}"
      OPENROUTER_AUTO_MODELS_HIGH: "${OPENROUTER_AUTO_MODELS_HIGH:-}"
      # Price caps, USD per 1M tokens (input and output); empty = no cap.
      OPENROUTER_MAX_PRICE: "${OPENROUTER_MAX_PRICE:-1}"  # fixed models + low tier
      OPENROUTER_MAX_PRICE_MEDIUM: "${OPENROUTER_MAX_PRICE_MEDIUM:-}"
      OPENROUTER_MAX_PRICE_HIGH: "${OPENROUTER_MAX_PRICE_HIGH:-}"
      # Per-model provider routing, JSON keyed by model id (empty = built-in:
      # google/gemini-4-argon pinned to the google-ai-studio/flex endpoint, $1/$5 per 1M).
      OPENROUTER_MODEL_ROUTES: "${OPENROUTER_MODEL_ROUTES:-}"
      OPENROUTER_REASONING_EFFORT: "${OPENROUTER_REASONING_EFFORT:-}"  # low | medium | high
      OPENROUTER_TEMPERATURE: "${OPENROUTER_TEMPERATURE:-}"
    volumes:
      - chat-data:/data  # endpoints added in the UI (API keys stay server-side)
    depends_on:
      # Started, not healthy: the chat is usable at once and lists local models
      # as they become available. Only one of the two runs, per profile.
      llama-server:
        condition: service_started
        required: false
      llama-server-gpu:
        condition: service_started
        required: false
      champions-mcp:
        # Only needs to have started, not finished: champions-mcp's own
        # first-run data pull can outlast this container's startup, so
        # main.py loads MCP tools lazily/retries rather than requiring them
        # to be ready here.
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mcp-internal

networks:
  # Private bridge network for service-to-service calls (champions-mcp <->
  # champions-calc, champions-chat <-> llama-server/champions-mcp). Host
  # access happens only through each service's own published "ports:" entry.
  mcp-internal:
    driver: bridge

volumes:
  champions-data:
    # Persists champions.sqlite + the PokeAPI pull cache across restarts.
    # Delete it (docker compose down -v) to force a full re-pull.
  llama_models:
    # Models downloaded from Hugging Face (web chat Models panel, LLAMA_MODEL_HF).
  chat-data:
    # Web chat settings: OpenAI-compatible endpoints added in the UI.
